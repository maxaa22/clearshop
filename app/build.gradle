plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.clear.shop'
    compileSdk 34

    defaultConfig {
        applicationId 'ua.clear.shop'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // підписуємо debug-ключем, щоб APK одразу встановлювався
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
